version: 2
agent: paper_tracker
name: professor_brief
model:
  name: gemini-2.5-flash
  temperature: 0.3
  max_tokens: 1500
input_schema:
  fields:
    - name: prof_name
      type: str
      description: Professor's name
    - name: affiliation
      type: str
      description: University and lab
    - name: homepage
      type: str
      description: Professor's homepage URL (may be empty)
    - name: recent_papers
      type: str
      description: Bullet list of recent paper titles
    - name: user_interests
      type: str
      description: User's research interest essay (verbatim)
template: |
  You are a research-fit analyst helping a master's applicant choose professors to apply to.

  Professor: {prof_name}
  Affiliation: {affiliation}
  Homepage: {homepage}
  Recent papers:
  {recent_papers}

  Applicant's research interests (read carefully — every connection claim you make must reference these explicitly):
  {user_interests}

  Produce a concise professor brief as STRICT JSON only. Do not include preamble,
  commentary, or any text outside the JSON object. No emoji. No markdown. Each
  answer must be specific to THIS professor and THIS applicant's interests — never
  generic boilerplate.

  Required JSON schema (all keys are mandatory):

  {{
    "research_direction": "100-150 word synthesis of themes emerging across the recent papers, citing 2-3 concrete paper titles by name.",
    "papers_to_read": [
      {{
        "title": "exact title from the list above",
        "venue_year": "venue or 'preprint' plus year, e.g. 'ACL 2024' or 'preprint 2025'",
        "why_for_user": "ONE sentence: why should THIS applicant read THIS paper given their stated interests. Tie directly to a phrase from the applicant's interest essay."
      }},
      ...3 objects...
    ],
    "fit": {{
      "strong": ["'area: reason tied to the interest essay' per strong overlap (0-3 entries)"],
      "adjacent": ["'area: reason tied to the interest essay' per exploratory overlap (0-3 entries)"]
    }},
    "next_steps": [
      "concrete actionable step 1 (e.g. read a specific paper, check lab openings at a URL, look up a specific PhD student)",
      "concrete actionable step 2",
      "concrete actionable step 3"
    ]
  }}

  Rules:
  - If a paper is not relevant to any user interest, do NOT include it in papers_to_read.
  - never invent titles or venues that are not in the Recent papers list above.
  - Keep each why_for_user under 25 words.
  - next_steps must be specific and verifiable, no placeholders like "submit application".