version: 1
agent: paper_tracker
name: professor_discovery
model:
  name: gemini-2.5-flash
  temperature: 0.4
  max_tokens: 100
input_schema:
  fields:
    - name: prof_name
      type: str
      description: Professor name
    - name: affiliation
      type: str
      description: University / lab
    - name: recent_paper_titles
      type: str
      description: Comma-separated recent paper titles
template: |
  Professor: {prof_name}
  Affiliation: {affiliation}
  Recent papers: {recent_paper_titles}

  Write a one-line focus summary of this professor's research area.
  Example: "Dense retrieval, conversational search, LLM-based re-ranking"
