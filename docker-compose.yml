# Career Copilot — docker-compose.yml
#
# 3 services (bot + worker + Postgres). Qdrant is remote (Qdrant Cloud).
#
# Run:  docker compose up -d
# Stop: docker compose down -v

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kitan
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: career_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitan -d career_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    image: career-copilot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kitan:dev@db:5432/career_copilot
      - APPINSIGHTS_CONNECTION_STRING=${APPINSIGHTS_CONNECTION_STRING:-}
    command: ["serve", "--polling"]
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents

  worker:
    build: .
    image: career-copilot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kitan:dev@db:5432/career_copilot
      - APPINSIGHTS_CONNECTION_STRING=${APPINSIGHTS_CONNECTION_STRING:-}
    command: ["worker"]
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents

volumes:
  pgdata:
