# Career Copilot — CI/CD (source-to-cloud, no Docker)
#
# Uses OIDC federated auth (no secrets needed for Azure).
# Requires: az ad app federated-credential create (see deploy/azure/README.md)
#
# GitHub secrets needed:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   TELEGRAMBOTTOKEN, GEMINIAPIKEY, DEEPSEEKAPIKEY
#   VOYAGEAPIKEY, TAVILYAPIKEY, FIRECRAWLAPIKEY
#   GITHUBTOKEN, DATABASEURL

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp CLI
        run: az extension add --name containerapp --upgrade

      - name: Deploy bot
        run: |
          az containerapp up \
            --name career-copilot-bot \
            --resource-group career-copilot \
            --environment career-copilot-env \
            --location germanywestcentral \
            --source . \
            --env-vars \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }} \
              GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }} \
              DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }} \
              VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }} \
              DATABASE_URL=${{ secrets.DATABASEURL }} \
              TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }} \
              FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }} \
              GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}

      - name: Deploy worker
        run: |
          az containerapp up \
            --name career-copilot-worker \
            --resource-group career-copilot \
            --environment career-copilot-env \
            --source . \
            --command "python -m career_copilot worker" \
            --env-vars \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }} \
              GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }} \
              DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }} \
              VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }} \
              DATABASE_URL=${{ secrets.DATABASEURL }} \
              TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }} \
              FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }} \
              GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}

      - name: Notify
        run: echo "Deployed bot + worker to career-copilot"
