# Career Copilot — CI/CD (build on GitHub, push to ACR, deploy to Container Apps)
#
# No ACR Tasks needed — Docker build runs on the GitHub Actions runner.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name careercopilot

      - name: Build and push image
        run: |
          docker build -t careercopilot.azurecr.io/career-copilot:latest .
          docker push careercopilot.azurecr.io/career-copilot:latest

      - name: Install containerapp CLI
        run: az extension add --name containerapp --upgrade

      - name: Deploy bot
        run: |
          az containerapp up \
            --name career-copilot-bot \
            --resource-group career-copilot \
            --environment career-copilot-env \
            --image careercopilot.azurecr.io/career-copilot:latest \
            --registry-server careercopilot.azurecr.io \
            --registry-username $(az acr credential show --name careercopilot --query username -o tsv) \
            --registry-password $(az acr credential show --name careercopilot --query "passwords[0].value" -o tsv) \
            --env-vars \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }} \
              GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }} \
              DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }} \
              VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }} \
              DATABASE_URL=${{ secrets.DATABASEURL }} \
              QDRANT_URL=${{ secrets.QDRANTURL }} \
              QDRANT_API_KEY=${{ secrets.QDRANTAPIKEY }} \
              TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }} \
              FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }} \
              GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}

      - name: Deploy worker
        run: |
          az containerapp create \
            --name career-copilot-worker \
            --resource-group career-copilot \
            --environment career-copilot-env \
            --image careercopilot.azurecr.io/career-copilot:latest \
            --registry-server careercopilot.azurecr.io \
            --registry-username $(az acr credential show --name careercopilot --query username -o tsv) \
            --registry-password $(az acr credential show --name careercopilot --query "passwords[0].value" -o tsv) \
            --command "/app/docker-entrypoint.sh worker" \
            --cpu 0.5 --memory 1.0Gi \
            --env-vars \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }} \
              GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }} \
              DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }} \
              VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }} \
              DATABASE_URL=${{ secrets.DATABASEURL }} \
              QDRANT_URL=${{ secrets.QDRANTURL }} \
              QDRANT_API_KEY=${{ secrets.QDRANTAPIKEY }} \
              TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }} \
              FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }} \
              GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}

      - name: Notify
        run: echo "Deployed bot + worker to career-copilot"
