# Career Copilot — CI/CD (build on GitHub, push to ACR, deploy to Container Apps)
#
# No ACR Tasks needed — Docker build runs on the GitHub Actions runner.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-hermes:
    runs-on: ubuntu-latest
    env:
      HERMES_FQDN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name careercopilot

      - name: Build and push hermes image
        run: |
          docker build -t careercopilot.azurecr.io/career-copilot-hermes:latest \
            -t careercopilot.azurecr.io/career-copilot-hermes:${GITHUB_SHA::8} \
            -f deploy/hermes/Dockerfile .
          docker push careercopilot.azurecr.io/career-copilot-hermes:latest
          docker push careercopilot.azurecr.io/career-copilot-hermes:${GITHUB_SHA::8}

      - name: Install containerapp CLI
        run: az extension add --name containerapp --upgrade

      - name: Deploy Hermes (create or update)
        run: |
          # Env vars as a bash array so a secret value containing spaces or
          # newlines is passed as ONE --env-vars argument (argparse would
          # otherwise split it and exit 2).
          ENV_ARGS=(
            'API_SERVER_ENABLED=true'
            'API_SERVER_HOST=0.0.0.0'
            'API_SERVER_PORT=8642'
            'API_SERVER_KEY=${{ secrets.HERMESAPIKEY }}'
            'GOOGLE_API_KEY=${{ secrets.GOOGLEAPIKEY }}'
            'DATABASE_URL=${{ secrets.DATABASEURL }}'
            'QDRANT_URL=${{ secrets.QDRANTURL }}'
            'QDRANT_API_KEY=${{ secrets.QDRANTAPIKEY }}'
            'TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }}'
            'VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }}'
            'FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }}'
            'SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTICSCHOLARAPIKEY }}'
            'USER_PROFILE_B64=${{ secrets.USERPROFILEB64 }}'
            'USER_SKILLS_B64=${{ secrets.USERSKILLSB64 }}'
            'GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}'
          )
          # SHA-suffixed tag: the updated app's image field changes on every
          # push, so `az containerapp update` rolls a real revision instead of
          # no-opping on an unchanged `:latest` string.
          IMAGE=careercopilot.azurecr.io/career-copilot-hermes:${GITHUB_SHA::8}
          if az containerapp show --name career-copilot-hermes --resource-group career-copilot > /dev/null 2>&1; then
            echo "Updating existing hermes app..."
            # Update reuses the ACR credentials already stored on the app;
            # --registry-* and --env-vars are unsupported by `az containerapp update`
            # (they break with argparse exit code 2), so use --replace-env-vars.
            az containerapp update \
              --name career-copilot-hermes \
              --resource-group career-copilot \
              --image $IMAGE \
              --min-replicas 1 --max-replicas 1 \
              --replace-env-vars "${ENV_ARGS[@]}"
          else
            echo "Creating hermes app..."
            az containerapp create \
              --name career-copilot-hermes \
              --resource-group career-copilot \
              --image $IMAGE \
              --registry-server careercopilot.azurecr.io \
              --registry-username $(az acr credential show --name careercopilot --query username -o tsv) \
              --registry-password $(az acr credential show --name careercopilot --query "passwords[0].value" -o tsv) \
              --environment career-copilot-env \
              --target-port 8642 \
              --ingress external \
              --cpu 1.0 --memory 2.0Gi \
              --min-replicas 1 --max-replicas 1 \
              --env-vars "${ENV_ARGS[@]}"
          fi
          echo "HERMES_FQDN=$(az containerapp show --name career-copilot-hermes --resource-group career-copilot --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"
          echo "Hermes API: https://$HERMES_FQDN/v1"

  deploy:
    runs-on: ubuntu-latest
    needs: [deploy-hermes]

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name careercopilot

      - name: Build and push image
        run: |
          docker build -t careercopilot.azurecr.io/career-copilot:latest \
            -t careercopilot.azurecr.io/career-copilot:${GITHUB_SHA::8} .
          docker push careercopilot.azurecr.io/career-copilot:latest
          docker push careercopilot.azurecr.io/career-copilot:${GITHUB_SHA::8}

      - name: Install containerapp CLI
        run: az extension add --name containerapp --upgrade

      - name: Resolve Hermes FQDN
        run: |
          FQDN=$(az containerapp show --name career-copilot-hermes --resource-group career-copilot --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "")
          echo "HERMES_FQDN=$FQDN" >> "$GITHUB_ENV"

      - name: Deploy bot
        run: |
          az containerapp up \
            --name career-copilot-bot \
            --resource-group career-copilot \
            --environment career-copilot-env \
            --image careercopilot.azurecr.io/career-copilot:${GITHUB_SHA::8} \
            --registry-server careercopilot.azurecr.io \
            --registry-username $(az acr credential show --name careercopilot --query username -o tsv) \
            --registry-password $(az acr credential show --name careercopilot --query "passwords[0].value" -o tsv) \
            --env-vars \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }} \
              GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }} \
              DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }} \
              VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }} \
              DATABASE_URL=${{ secrets.DATABASEURL }} \
              QDRANT_URL=${{ secrets.QDRANTURL }} \
              QDRANT_API_KEY=${{ secrets.QDRANTAPIKEY }} \
              TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }} \
              FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }} \
              SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTICSCHOLARAPIKEY }} \
              USER_PROFILE_B64=${{ secrets.USERPROFILEB64 }} \
              USER_SKILLS_B64=${{ secrets.USERSKILLSB64 }} \
              GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }} \
              HERMES_API_URL=https://${{ env.HERMES_FQDN }}/v1 \
              HERMES_API_KEY=${{ secrets.HERMESAPIKEY }}

      - name: Deploy worker
        run: |
          ENV_ARGS=(
            'TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAMBOTTOKEN }}'
            'GEMINI_API_KEY=${{ secrets.GEMINIAPIKEY }}'
            'DEEPSEEK_API_KEY=${{ secrets.DEEPSEEKAPIKEY }}'
            'VOYAGE_API_KEY=${{ secrets.VOYAGEAPIKEY }}'
            'DATABASE_URL=${{ secrets.DATABASEURL }}'
            'QDRANT_URL=${{ secrets.QDRANTURL }}'
            'QDRANT_API_KEY=${{ secrets.QDRANTAPIKEY }}'
            'TAVILY_API_KEY=${{ secrets.TAVILYAPIKEY }}'
            'FIRECRAWL_API_KEY=${{ secrets.FIRECRAWLAPIKEY }}'
            'SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTICSCHOLARAPIKEY }}'
            'USER_PROFILE_B64=${{ secrets.USERPROFILEB64 }}'
            'USER_SKILLS_B64=${{ secrets.USERSKILLSB64 }}'
            'GITHUB_TOKEN=${{ secrets.GITHUBTOKEN }}'
            'HERMES_API_URL=https://${{ env.HERMES_FQDN }}/v1'
            'HERMES_API_KEY=${{ secrets.HERMESAPIKEY }}'
          )
          # SHA-suffixed tag so re-runs roll a new revision (see deploy-hermes).
          IMAGE=careercopilot.azurecr.io/career-copilot:${GITHUB_SHA::8}
          if az containerapp show --name career-copilot-worker --resource-group career-copilot > /dev/null 2>&1; then
            echo "Updating existing worker app..."
            az containerapp update \
              --name career-copilot-worker \
              --resource-group career-copilot \
              --image $IMAGE \
              --command /app/docker-entrypoint.sh \
              --args worker \
              --min-replicas 1 --max-replicas 1 \
              --replace-env-vars "${ENV_ARGS[@]}"
          else
            echo "Creating worker app..."
            az containerapp create \
              --name career-copilot-worker \
              --resource-group career-copilot \
              --environment career-copilot-env \
              --image $IMAGE \
              --registry-server careercopilot.azurecr.io \
              --registry-username $(az acr credential show --name careercopilot --query username -o tsv) \
              --registry-password $(az acr credential show --name careercopilot --query "passwords[0].value" -o tsv) \
              --command /app/docker-entrypoint.sh \
              --args worker \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 1 --max-replicas 1 \
              --env-vars "${ENV_ARGS[@]}"
          fi

      - name: Configure observability (Log Analytics)
        run: |
          RG=career-copilot
          WS=career-copilot-logs
          if ! az monitor log-analytics workspace show --resource-group "$RG" --workspace-name "$WS" -o none 2>/dev/null; then
            az monitor log-analytics workspace create --resource-group "$RG" --workspace-name "$WS" --location germanywestcentral -o none
          fi
          WS_CUSTOMER_ID=$(az monitor log-analytics workspace show --resource-group "$RG" --workspace-name "$WS" --query customerId -o tsv)
          WS_KEY=$(az monitor log-analytics workspace get-shared-keys --resource-group "$RG" --workspace-name "$WS" --query primarySharedKey -o tsv)
          az containerapp env update \
            --name career-copilot-env \
            --resource-group "$RG" \
            --logs-destination log-analytics \
            --logs-workspace-id "$WS_CUSTOMER_ID" \
            --logs-workspace-key "$WS_KEY" -o none
          WS_ID=$(az monitor log-analytics workspace show --resource-group "$RG" --workspace-name "$WS" --query id -o tsv)
          for app in career-copilot-bot career-copilot-worker career-copilot-hermes; do
            APP_ID=$(az containerapp show --name "$app" --resource-group "$RG" --query id -o tsv)
            az monitor diagnostic-settings create \
              --name containerapp-metrics \
              --resource "$APP_ID" \
              --workspace "$WS_ID" \
              --metrics '[{"category":"AllMetrics","enabled":true}]' -o none
          done

      - name: Notify
        run: echo "Deployed bot + worker + hermes to career-copilot"
