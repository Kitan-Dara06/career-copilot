# Career Copilot → Hermes MCP configuration.
#
# This block goes into ~/.hermes/config.yaml under `mcp_servers`.
# It tells Hermes to launch the Career Copilot MCP server as a stdio
# subprocess and expose only the read-only tools listed in `tools.include`.
#
# Install the mcp dependency first:
#   cd /home/kitan/Documents/mutli-agent && uv sync

mcp_servers:
  career_copilot:
    command: "uv"
    args:
      - "--directory"
      - "/home/kitan/Documents/mutli-agent"
      - "run"
      - "python"
      - "-m"
      - "backbone.mcp.server"
    enabled: true
    timeout: 120
    connect_timeout: 30
    supports_parallel_tool_calls: false
    tools:
      include:
        - career.profile.get
        - career.papers.search
        - career.professors.search
        - career.jobs.search
        # Planning — read side (Phase 2)
        - career.planning.get_summary
        - career.planning.list_workspaces
        - career.planning.get_workspace
        - career.planning.list_goals
        - career.planning.list_tasks
        - career.planning.list_decisions
        - career.planning.list_notes
        - career.planning.list_artifacts
        # Planning — write side (Phase 2, proposal-gated)
        - career.planning.create_workspace
        - career.planning.add_goal
        - career.planning.add_task
        - career.planning.record_decision
        - career.planning.supersede_decision
        - career.planning.update_task_status
        - career.planning.add_note
        - career.planning.switch_workspace
      resources: false
      prompts: false
